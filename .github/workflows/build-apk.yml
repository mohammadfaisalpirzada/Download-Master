name: Build Download Master APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode Keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "HAVE_KS=1" >> "$GITHUB_ENV"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "HAVE_KS=0" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: |
          set +e
          if [ "$HAVE_KS" = "1" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          echo "Executing task: $TASK"
          gradle $TASK --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -nE "^e: |error: |Unresolved reference|cannot access|> Task .* FAILED|Caused by:|Exception:|FAILURE:|What went wrong" build.log | tail -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit $code
          fi

      - name: Find and Rename APK
        run: |
          mkdir -p artifacts
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "artifacts/Download-Master-v1.0.${{ github.run_number }}.apk"
            echo "Found APK at $APK_PATH, copied to artifacts"
          else
            echo "No APK found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Download-Master-APK
          path: artifacts/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Download Master v1.0.${{ github.run_number }}"
          body: |
            ## Download Master - Release v1.0.${{ github.run_number }}
            - Zero Login Required (100% Privacy Focused)
            - Supports YouTube, TikTok (No Watermark), Facebook, Instagram, Twitter / X, and Web Videos
            - Selectable Resolutions (1080p Full HD, 720p HD, 480p, 360p, MP3 Audio)
            - Built-in In-App Player and Gallery
            - Material 3 Design
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
